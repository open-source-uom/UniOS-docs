site_name: UniOS Docs
site_url: https://docs.unios-project.eu

nav:
 - Home: index.md
 - Installing UniOS: install-guide.md
 - General Dev Workflow: generalworkflow.md
 - Adding docs: addingdocs.md
 - Our build server: build.unios-project.eu.md
 - UniBackpack: unibackpack.md
 - UniDesk: unidesk.md
 - UniNews: uninews.md
 - UniOS-landing-page: UniOS-landing-page.md
 - unios-desktop-settings: unios-desktop-settings.md
 - unios-update: unios-update.md
 - unios-repo: unios-repo.md

theme:
  name: material
  favicon: img/favicon.ico
  logo: img/favicon.ico

  palette:
      - media: "(prefers-color-scheme)"
        toggle:
          icon: material/brightness-auto
          name: Switch to light mode

      - media: "(prefers-color-scheme: light)"
        scheme: default
        primary: purple
        accent: purple
        toggle:
          icon: material/brightness-7
          name: Switch to dark mode

      - media: "(prefers-color-scheme: dark)"
        scheme: slate
        primary: purple
        accent: purple
        toggle:
          icon: material/brightness-4
          name: Switch to system preference
